version: '3.8'

services:
  mongodb:
    image: mongo
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root                # Root username
      MONGO_INITDB_ROOT_PASSWORD: mongo-password      # Root password
    ports:
      - "27017:27017"
    volumes:
      - ./services/init-mongo:/docker-entrypoint-initdb.d      # Optional: path for init scripts
      - data-volume:/data/db
    networks:
      - um-network

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://um:um-password@mongodb:27017/um
    volumes:
      - ./services/config.js:/config/config.js  # Mount the config.js file
    depends_on:
      - mongodb
    networks:
      - um-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: um-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://um:um-password@mongodb:27017/um
      JWT_SECRET: AZER-1234-TYUI-5678-OPQS
      PORT: 8080
    networks:
      - um-network

volumes:
  data-volume:

networks:
  um-network:
    external: true
